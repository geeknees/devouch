# ABOUTME: Verifies the Devouch source, real-contract integration, and reproducible distribution.
# ABOUTME: Uses disposable local accounts and does not deploy, publish, or require wallet secrets.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bundle exec rake test
      - run: bundle exec rake lint
      - run: bun test test/ts
      - run: bun run typecheck
      - run: bun run test:integration
      - run: git diff --exit-code -- dist/
