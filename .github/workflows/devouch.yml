# ABOUTME: Reports the pull request author's endorsement against this repository's policy.
# ABOUTME: Uses an immutable Devouch release without checking out or executing PR code.
name: Devouch

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  endorsement:
    name: Devouch endorsement report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: geeknees/devouch@4aa03f7f6bea64701a6bbab0ff6420df1457b2fb
        with:
          policy-path: .devouch/policy.json
          mode: report
          rpc-url: https://rpc.sepolia.ethpandaops.io
          github-token: ${{ github.token }}
